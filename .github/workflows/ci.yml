name: Backend checks
on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.12.17
      - run: make setup check
